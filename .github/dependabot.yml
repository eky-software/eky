version: 2

updates:
  - package-ecosystem: npm
    directory: /eky_software
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 6
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      compatible-patch-and-minor:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - electron
          - better-sqlite3
          - "@electron/*"
          - "@hono/node-server"
          - hono
          - pdfkit
          - "@playwright/test"
          - typescript
          - vite
          - "@vitejs/plugin-react"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 4
