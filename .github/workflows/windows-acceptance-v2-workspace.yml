name: Windows acceptance V2 workspace success and fault recovery

on:
  workflow_call:
    inputs:
      risk_plan:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-acceptance-v2-workspace-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EKY_V2_WORKSPACE_ARTIFACT_NAME: eky-v2-workspace-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  workspace_artifact_contracts:
    name: Verify V2.6 artifact and runtime contracts
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eky_software
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace artifact behavior and workflow contract
        run: pnpm --filter @eky/desktop installer:test:windows-acceptance-workspace-artifact

      - name: Verify workspace lifecycle and read-only Windows adapters
        run: pnpm --filter @eky/desktop installer:test:windows-acceptance-workspace

      - name: Verify workspace fault lifecycle and terminal contracts
        run: pnpm --filter @eky/desktop installer:test:windows-acceptance-workspace-fault

      - name: Set up .NET SDK for command contracts
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302

      - name: Verify mandatory caller results and bounded phase writer
        run: pnpm --filter @eky/desktop installer:test:windows-acceptance-phase-writer

  workspace_artifact_producer:
    name: Build workspace acceptance artifact once
    needs: workspace_artifact_contracts
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      build_revision: ${{ steps.produce.outputs.build_revision }}
      descriptor_sha256: ${{ steps.produce.outputs.descriptor_sha256 }}
      source_package_sha256: ${{ steps.produce.outputs.source_package_sha256 }}
      target_package_sha256: ${{ steps.produce.outputs.target_package_sha256 }}
    defaults:
      run:
        working-directory: eky_software
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          if ((dotnet --version) -ne '10.0.302') { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_DOTNET_SDK_INVALID' }
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore locked WiX toolchain
        run: pnpm --filter @eky/desktop installer:verify-restore-lock
      - name: Build workspace artifact once
        id: produce
        shell: pwsh
        timeout-minutes: 22
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact'
          $summaryPath = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-summary.json'
          if ((Test-Path -LiteralPath $artifactRoot) -or (Test-Path -LiteralPath $summaryPath)) {
            throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_OUTPUT_EXISTS'
          }
          pnpm --filter @eky/desktop installer:v2-workspace-artifact:build --artifact-root $artifactRoot --summary-path $summaryPath
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_BUILD_FAILED' }
          $summary = Get-Content -LiteralPath $summaryPath -Raw -Encoding utf8 | ConvertFrom-Json
          $keys = @('schemaVersion', 'status', 'resultCode', 'buildRevision', 'descriptorSha256',
            'sourcePackageSha256', 'targetPackageSha256', 'sourcePayloadIdentity', 'targetPayloadIdentity') | Sort-Object
          if (@(Compare-Object $keys @($summary.PSObject.Properties.Name | Sort-Object)).Count -ne 0 -or
            $summary.schemaVersion -ne 1 -or $summary.status -cne 'completed' -or
            $summary.resultCode -cne 'workspaceSuccessArtifactBuilt' -or $summary.buildRevision -cnotmatch '^[0-9a-f]{40}$') {
            throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_SUMMARY_INVALID'
          }
          foreach ($key in @('descriptorSha256', 'sourcePackageSha256', 'targetPackageSha256', 'sourcePayloadIdentity', 'targetPayloadIdentity')) {
            if ($summary.$key -cnotmatch '^[0-9a-f]{64}$') { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_SUMMARY_INVALID' }
          }
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $summary.buildRevision -cne $headRevision) {
            throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_BUILD_IDENTITY_MISMATCH'
          }
          "build_revision=$($summary.buildRevision)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "descriptor_sha256=$($summary.descriptorSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_package_sha256=$($summary.sourcePackageSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_package_sha256=$($summary.targetPackageSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify produced workspace artifact
        shell: pwsh
        env:
          EXPECTED_BUILD_REVISION: ${{ steps.produce.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ steps.produce.outputs.descriptor_sha256 }}
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact'
          pnpm --filter @eky/desktop installer:v2-workspace-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_VERIFICATION_FAILED' }
      - name: Upload exact workspace artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.EKY_V2_WORKSPACE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/eky-v2-workspace-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  workspace_consumer:
    name: Verify packaged workspace success run ${{ matrix.repetition }}
    needs: workspace_artifact_producer
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repetition: ${{ fromJSON(inputs.risk_plan != '' && fromJSON(inputs.risk_plan).repetitions == 1 && '[1]' || '[1, 2]') }}
    defaults:
      run:
        working-directory: eky_software
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          if ((dotnet --version) -ne '10.0.302') { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_DOTNET_SDK_INVALID' }
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact workspace artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.workspace_artifact_producer.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/eky-v2-workspace-artifact
      - name: Verify downloaded workspace artifact
        shell: pwsh
        env:
          EXPECTED_BUILD_REVISION: ${{ needs.workspace_artifact_producer.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.workspace_artifact_producer.outputs.descriptor_sha256 }}
        run: |
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headRevision -cne $env:EXPECTED_BUILD_REVISION) {
            throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_BUILD_IDENTITY_MISMATCH'
          }
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact'
          pnpm --filter @eky/desktop installer:v2-workspace-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_VERIFICATION_FAILED' }
      - name: Run supervised workspace success once
        shell: pwsh
        timeout-minutes: 25
        env:
          EXPECTED_BUILD_REVISION: ${{ needs.workspace_artifact_producer.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.workspace_artifact_producer.outputs.descriptor_sha256 }}
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact\workspace-success-artifact.json'
          $resultPath = Join-Path (Join-Path $env:RUNNER_TEMP ('eky-workspace-caller-' + [Guid]::NewGuid().ToString('N'))) 'result.json'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm --filter @eky/desktop installer:v2-workspace-success --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath
          $commandExit = $LASTEXITCODE
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/verifyWorkspaceCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_LIFECYCLE_FAILED' }
      - name: Reverify downloaded workspace artifact
        if: ${{ always() && steps.download.outcome == 'success' }}
        shell: pwsh
        env:
          EXPECTED_BUILD_REVISION: ${{ needs.workspace_artifact_producer.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.workspace_artifact_producer.outputs.descriptor_sha256 }}
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact'
          pnpm --filter @eky/desktop installer:v2-workspace-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_POST_VERIFICATION_FAILED' }

  workspace_fault_consumer:
    if: inputs.risk_plan == '' || fromJSON(inputs.risk_plan).gates.workspaceFault
    name: Verify packaged workspace fault recovery run ${{ matrix.repetition }}
    needs: workspace_artifact_producer
    runs-on: windows-latest
    # Five existing 25-minute consumer-step envelopes plus setup/reverification.
    # Each scenario still uses the same 720s Job with its included 30s cleanup.
    timeout-minutes: 140
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repetition: ${{ fromJSON(inputs.risk_plan != '' && fromJSON(inputs.risk_plan).repetitions == 1 && '[1]' || '[1, 2]') }}
    defaults:
      run:
        working-directory: eky_software
    env:
      EXPECTED_BUILD_REVISION: ${{ needs.workspace_artifact_producer.outputs.build_revision }}
      EXPECTED_DESCRIPTOR_SHA256: ${{ needs.workspace_artifact_producer.outputs.descriptor_sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          if ((dotnet --version) -ne '10.0.302') { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_DOTNET_SDK_INVALID' }
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact workspace artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.workspace_artifact_producer.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/eky-v2-workspace-artifact
      - name: Verify downloaded workspace artifact
        shell: pwsh
        run: |
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headRevision -cne $env:EXPECTED_BUILD_REVISION) {
            throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_BUILD_IDENTITY_MISMATCH'
          }
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact'
          pnpm --filter @eky/desktop installer:v2-workspace-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_VERIFICATION_FAILED' }
      - name: Prepare existing supervisor and proof readers once
        shell: pwsh
        run: |
          pnpm --filter @eky/desktop installer:supervisor:build
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_SUPERVISOR_BUILD_FAILED' }
          pnpm --filter @eky/desktop e2e:prepare-electron-runtime
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_RUNTIME_PREPARATION_FAILED' }
          pnpm --filter @eky/desktop e2e:build
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_PROOF_BUILD_FAILED' }
      - name: Verify pre-update recovery point failure
        shell: pwsh
        timeout-minutes: 25
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact\workspace-success-artifact.json'
          $resultPath = Join-Path (Join-Path $env:RUNNER_TEMP ('eky-workspace-caller-' + [Guid]::NewGuid().ToString('N'))) 'result.json'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/runWorkspaceFault.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario preUpdateRecoveryPointFailure --result-path $resultPath
          $commandExit = $LASTEXITCODE
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/verifyWorkspaceCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario preUpdateRecoveryPointFailure --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_FAULT_LIFECYCLE_FAILED' }
      - name: Verify active workspace business and binary rollback
        shell: pwsh
        timeout-minutes: 25
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact\workspace-success-artifact.json'
          $resultPath = Join-Path (Join-Path $env:RUNNER_TEMP ('eky-workspace-caller-' + [Guid]::NewGuid().ToString('N'))) 'result.json'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/runWorkspaceFault.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario activeWorkspaceFirstStartFailure --result-path $resultPath
          $commandExit = $LASTEXITCODE
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/verifyWorkspaceCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario activeWorkspaceFirstStartFailure --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_FAULT_LIFECYCLE_FAILED' }
      - name: Verify interrupted acceptance recovery and restart
        shell: pwsh
        timeout-minutes: 25
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact\workspace-success-artifact.json'
          $resultPath = Join-Path (Join-Path $env:RUNNER_TEMP ('eky-workspace-caller-' + [Guid]::NewGuid().ToString('N'))) 'result.json'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/runWorkspaceFault.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario acceptanceInterruption --result-path $resultPath
          $commandExit = $LASTEXITCODE
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/verifyWorkspaceCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario acceptanceInterruption --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_FAULT_LIFECYCLE_FAILED' }
      - name: Verify passive workspace migration recovery
        shell: pwsh
        timeout-minutes: 25
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact\workspace-success-artifact.json'
          $resultPath = Join-Path (Join-Path $env:RUNNER_TEMP ('eky-workspace-caller-' + [Guid]::NewGuid().ToString('N'))) 'result.json'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/runWorkspaceFault.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario passiveWorkspaceMigrationFailure --result-path $resultPath
          $commandExit = $LASTEXITCODE
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/verifyWorkspaceCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario passiveWorkspaceMigrationFailure --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_FAULT_LIFECYCLE_FAILED' }
      - name: Verify binary rollback failure stays recovery-only
        shell: pwsh
        timeout-minutes: 25
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact\workspace-success-artifact.json'
          $resultPath = Join-Path (Join-Path $env:RUNNER_TEMP ('eky-workspace-caller-' + [Guid]::NewGuid().ToString('N'))) 'result.json'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/runWorkspaceFault.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario binaryRollbackFailure --result-path $resultPath
          $commandExit = $LASTEXITCODE
          pnpm --filter @eky/desktop exec node installer/windows-acceptance-harness/verifyWorkspaceCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario binaryRollbackFailure --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_FAULT_LIFECYCLE_FAILED' }
      - name: Reverify downloaded workspace artifact
        if: ${{ always() && steps.download.outcome == 'success' }}
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-workspace-artifact'
          pnpm --filter @eky/desktop installer:v2-workspace-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_WORKSPACE_ARTIFACT_POST_VERIFICATION_FAILED' }
