name: V2.5 packaged legacy diagnostic (not acceptance)

on:
  push:
    branches:
      - codex/test-harness-v2-legacy-upgrade
    paths:
      - .github/workflows/windows-acceptance-v2-legacy-diagnostic.yml
      - eky_software/apps/desktop/installer/windows-acceptance-harness/**
      - eky_software/apps/desktop/installer/windows-process-supervisor/**
      - eky_software/apps/desktop/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-acceptance-v25-diagnostic-${{ github.ref_name }}
  cancel-in-progress: false

env:
  EKY_V25_ARTIFACT_NAME: eky-v25-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  legacy_contracts:
    name: V2.5 diagnostic contracts run ${{ matrix.repetition }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    defaults:
      run:
        working-directory: eky_software/apps/desktop
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Bind the verified SDK executable
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet.exe -CommandType Application -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($dotnet) -or (& $dotnet --version) -cne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_DOTNET_SDK_INVALID'
          }
          "EKY_DOTNET_EXE=$dotnet" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable existing package manager
        run: corepack enable

      - name: Record diagnostic revision and runner image
        shell: pwsh
        run: |
          [ordered]@{
            schemaVersion = 1
            diagnosticOnly = $true
            harnessRevision = $env:GITHUB_SHA
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            nodeVersion = (node --version)
            dotnetVersion = (dotnet --version)
          } | ConvertTo-Json -Compress

      - name: Run unchanged full legacy contracts
        run: pnpm installer:test:windows-supervisor-v2-legacy

  legacy_artifact_producer:
    name: Build one diagnostic historical source and target artifact
    needs: legacy_contracts
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      build_revision: ${{ steps.produce.outputs.build_revision }}
      descriptor_sha256: ${{ steps.produce.outputs.descriptor_sha256 }}
      source_package_sha256: ${{ steps.produce.outputs.source_package_sha256 }}
      target_package_sha256: ${{ steps.produce.outputs.target_package_sha256 }}
    defaults:
      run:
        working-directory: eky_software
    steps:
      - name: Check out exact diagnostic revision and historical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Bind the verified SDK executable
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet.exe -CommandType Application -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($dotnet) -or (& $dotnet --version) -cne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_DOTNET_SDK_INVALID'
          }
          "EKY_DOTNET_EXE=$dotnet" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable Corepack
        run: corepack enable

      - name: Install existing locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify legacy artifact and diagnostic workflow contracts
        run: pnpm --filter @eky/desktop installer:test:windows-acceptance-legacy-artifact

      - name: Restore locked WiX toolchain
        run: pnpm --filter @eky/desktop installer:verify-restore-lock

      - name: Build diagnostic legacy artifact once
        id: produce
        shell: pwsh
        timeout-minutes: 22
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v25-legacy-artifact'
          $summaryPath = Join-Path $env:RUNNER_TEMP 'eky-v25-legacy-summary.json'
          if ((Test-Path -LiteralPath $artifactRoot) -or (Test-Path -LiteralPath $summaryPath)) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_ARTIFACT_OUTPUT_EXISTS'
          }
          pnpm --filter @eky/desktop installer:v2-legacy-artifact:build --artifact-root $artifactRoot --summary-path $summaryPath
          if ($LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_ARTIFACT_BUILD_FAILED'
          }
          $summary = Get-Content -LiteralPath $summaryPath -Raw -Encoding utf8 | ConvertFrom-Json
          $expectedKeys = @(
            'buildRevision', 'descriptorSha256', 'resultCode', 'schemaVersion',
            'sourceArtifactClass', 'sourcePackageSha256', 'status',
            'targetPackageSha256', 'targetPayloadIdentity'
          ) | Sort-Object
          $actualKeys = @($summary.PSObject.Properties.Name | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expectedKeys -DifferenceObject $actualKeys).Count -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_ARTIFACT_SUMMARY_INVALID'
          }
          if (
            $summary.schemaVersion -ne 1 -or
            $summary.status -cne 'completed' -or
            $summary.resultCode -cne 'legacyUpgradeArtifactBuilt' -or
            $summary.sourceArtifactClass -cne 'historical-source-rebuild' -or
            $summary.buildRevision -cnotmatch '^[0-9a-f]{40}$' -or
            $summary.descriptorSha256 -cnotmatch '^[0-9a-f]{64}$' -or
            $summary.sourcePackageSha256 -cnotmatch '^[0-9a-f]{64}$' -or
            $summary.targetPackageSha256 -cnotmatch '^[0-9a-f]{64}$' -or
            $summary.targetPayloadIdentity -cnotmatch '^[0-9a-f]{64}$'
          ) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_ARTIFACT_SUMMARY_INVALID'
          }
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $summary.buildRevision -cne $headRevision -or $headRevision -cne $env:GITHUB_SHA) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_ARTIFACT_BUILD_IDENTITY_MISMATCH'
          }
          "build_revision=$($summary.buildRevision)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "descriptor_sha256=$($summary.descriptorSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_package_sha256=$($summary.sourcePackageSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_package_sha256=$($summary.targetPackageSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify produced artifact before upload
        shell: pwsh
        env:
          EXPECTED_BUILD_REVISION: ${{ steps.produce.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ steps.produce.outputs.descriptor_sha256 }}
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v25-legacy-artifact'
          pnpm --filter @eky/desktop installer:v2-legacy-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_ARTIFACT_VERIFICATION_FAILED'
          }

      - name: Upload only verified diagnostic artifact bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.EKY_V25_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/eky-v25-legacy-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  legacy_consumer:
    name: V2.5 packaged legacy diagnostic run ${{ matrix.repetition }}
    needs: legacy_artifact_producer
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repetition: [1, 2]
    defaults:
      run:
        working-directory: eky_software
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Bind the verified SDK executable
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet.exe -CommandType Application -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($dotnet) -or (& $dotnet --version) -cne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_DOTNET_SDK_INVALID'
          }
          "EKY_DOTNET_EXE=$dotnet" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable Corepack
        run: corepack enable

      - name: Install existing locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download same diagnostic artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.EKY_V25_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/eky-v25-legacy-artifact

      - name: Verify downloaded artifact and checkout identity
        shell: pwsh
        env:
          EXPECTED_BUILD_REVISION: ${{ needs.legacy_artifact_producer.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.legacy_artifact_producer.outputs.descriptor_sha256 }}
        run: |
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headRevision -cne $env:EXPECTED_BUILD_REVISION -or $headRevision -cne $env:GITHUB_SHA) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_ARTIFACT_BUILD_IDENTITY_MISMATCH'
          }
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v25-legacy-artifact'
          pnpm --filter @eky/desktop installer:v2-legacy-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_ARTIFACT_VERIFICATION_FAILED'
          }

      - name: Run existing supervised legacy lifecycle once (diagnostic only)
        shell: pwsh
        timeout-minutes: 12
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-v25-legacy-artifact\legacy-upgrade-artifact.json'
          pnpm --filter @eky/desktop installer:v2-legacy --artifact-descriptor $descriptorPath
          if ($LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_LIFECYCLE_FAILED'
          }

      - name: Reverify diagnostic artifact bytes after lifecycle
        if: ${{ always() && steps.download.outcome == 'success' }}
        shell: pwsh
        env:
          EXPECTED_BUILD_REVISION: ${{ needs.legacy_artifact_producer.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.legacy_artifact_producer.outputs.descriptor_sha256 }}
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v25-legacy-artifact'
          pnpm --filter @eky/desktop installer:v2-legacy-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_ARTIFACT_POST_VERIFICATION_FAILED'
          }
