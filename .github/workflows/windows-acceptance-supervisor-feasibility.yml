name: Windows acceptance supervisor feasibility

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: Contract acceptance or diagnostic comparison (not acceptance)
        type: choice
        default: contracts
        options:
          - contracts
          - window-startup-diagnostic
          - legacy-contracts-diagnostic
          - legacy-worker-diagnostic
          - packaged-boundary-diagnostic
      artifact_kind:
        description: Existing artifact consumer (diagnostic only)
        type: choice
        options: [legacy, workspace]
      artifact_run_id:
        description: Original artifact producer run ID
        type: string
      artifact_id:
        description: Exact immutable artifact ID
        type: string
      artifact_build_revision:
        description: Original artifact build revision
        type: string
      artifact_descriptor_sha256:
        description: Expected original descriptor SHA-256
        type: string

permissions:
  contents: read

concurrency:
  group: windows-acceptance-supervisor-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ inputs.mode == 'packaged-boundary-diagnostic' && inputs.artifact_kind || '' }}
  cancel-in-progress: true

jobs:
  job-object-feasibility:
    if: inputs.mode != 'packaged-boundary-diagnostic'
    name: ${{ inputs.mode == 'window-startup-diagnostic' && 'V2.5 window startup diagnostic (not acceptance)' || inputs.mode == 'legacy-worker-diagnostic' && format('V2.5 worker diagnostic run {0} (not acceptance)', matrix.repetition) || inputs.mode == 'legacy-contracts-diagnostic' && format('V2.5 contracts diagnostic run {0} (not acceptance)', matrix.repetition) || format('Windows Job Object feasibility run {0}', matrix.repetition) }}
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        repetition: ${{ fromJSON(inputs.mode == 'window-startup-diagnostic' && '[1]' || '[1, 2]') }}

    defaults:
      run:
        working-directory: eky_software/apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Bind the verified SDK executable for all process contracts
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet.exe -CommandType Application -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($dotnet) -or (& $dotnet --version) -ne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_SUPERVISOR_DOTNET_SDK_INVALID'
          }
          "EKY_DOTNET_EXE=$dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows process supervisor
        if: inputs.mode != 'legacy-contracts-diagnostic'
        run: node installer/windows-process-supervisor/buildWindowsAcceptanceSupervisor.mjs

      - name: Run supervisor unit and process contracts
        if: inputs.mode != 'window-startup-diagnostic' && inputs.mode != 'legacy-contracts-diagnostic' && inputs.mode != 'legacy-worker-diagnostic'
        run: >-
          node --test --test-concurrency=1
          installer/windows-process-supervisor/tests/windowsAcceptanceSupervisorResult.test.mjs
          installer/windows-process-supervisor/tests/windowsAcceptanceSupervisor.contract.test.mjs

      - name: Diagnose one native window startup without MSI or acceptance matrix
        if: inputs.mode == 'window-startup-diagnostic'
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern="^native close observation: visible$"
          installer/windows-acceptance-harness/requestWindowsApplicationClose.test.mjs

      - name: Enable existing package manager for diagnostic contracts
        if: inputs.mode == 'legacy-contracts-diagnostic'
        run: corepack enable

      - name: Record diagnostic revision and runner image
        if: inputs.mode == 'legacy-contracts-diagnostic' || inputs.mode == 'legacy-worker-diagnostic'
        shell: pwsh
        env:
          DIAGNOSTIC_REPETITION: ${{ matrix.repetition }}
        run: |
          [ordered]@{
            schemaVersion = 1
            diagnosticOnly = $true
            harnessRevision = $env:GITHUB_SHA
            repetition = [int]$env:DIAGNOSTIC_REPETITION
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            nodeVersion = (node --version)
            dotnetVersion = (dotnet --version)
          } | ConvertTo-Json -Compress

      - name: Diagnose full V2.5 contract suite with unchanged default budgets
        if: inputs.mode == 'legacy-contracts-diagnostic'
        run: pnpm installer:test:windows-supervisor-v2-legacy

      - name: Diagnose legacy worker live-child contract without MSI or acceptance matrix
        if: inputs.mode == 'legacy-worker-diagnostic'
        run: >-
          node --test --test-concurrency=1
          installer/windows-acceptance-harness/runLegacyUpgradeWorker.test.mjs

  packaged-boundary-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'packaged-boundary-diagnostic'
    name: Existing ${{ inputs.artifact_kind }} artifact caller diagnostic (not acceptance)
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.artifact_kind == 'legacy' && 37 || 30 }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: eky_software
        shell: pwsh
    env:
      ARTIFACT_KIND: ${{ inputs.artifact_kind }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      EXPECTED_BUILD_REVISION: ${{ inputs.artifact_build_revision }}
      EXPECTED_DESCRIPTOR_SHA256: ${{ inputs.artifact_descriptor_sha256 }}
    steps:
      - name: Check out exact diagnostic harness revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate closed diagnostic identity before download
        run: |
          if ($env:ARTIFACT_KIND -cnotin @('legacy', 'workspace') -or
              $env:ARTIFACT_RUN_ID -cnotmatch '^[1-9][0-9]{0,19}$' -or
              $env:ARTIFACT_ID -cnotmatch '^[1-9][0-9]{0,19}$' -or
              $env:EXPECTED_BUILD_REVISION -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_DESCRIPTOR_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_IDENTITY_INVALID'
          }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_CHECKOUT_INVALID'
          }
          [ordered]@{ schemaVersion = 1; diagnosticOnly = $true;
            harnessRevision = $head; artifactBuildRevision = $env:EXPECTED_BUILD_REVISION;
            artifactRunId = $env:ARTIFACT_RUN_ID; artifactId = $env:ARTIFACT_ID;
            descriptorSha256 = $env:EXPECTED_DESCRIPTOR_SHA256 } | ConvertTo-Json -Compress

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up existing .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302

      - name: Bind verified SDK and install existing locked dependencies
        run: |
          $dotnet = (Get-Command dotnet.exe -CommandType Application -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($dotnet) -or (& $dotnet --version) -cne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_SDK_INVALID'
          }
          "EKY_DOTNET_EXE=$dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          corepack enable
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_PREPARATION_FAILED' }

      - name: Download only the specified existing artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: ${{ runner.temp }}/eky-existing-boundary-artifact

      - name: Verify existing artifact before diagnostic
        run: |
          $verifier = if ($env:ARTIFACT_KIND -ceq 'legacy') { 'verifyLegacyUpgradeArtifact.mjs' } else { 'verifyWorkspaceSuccessArtifact.mjs' }
          $root = Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact'
          pnpm --filter @eky/desktop exec node "installer/windows-acceptance-harness/$verifier" --artifact-root $root --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_ARTIFACT_INVALID' }

      - name: Prepare existing supervisor and only the required proof readers
        timeout-minutes: 3
        run: |
          pnpm --filter @eky/desktop installer:supervisor:build
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_PREPARATION_FAILED' }
          if ($env:ARTIFACT_KIND -ceq 'workspace') {
            pnpm --filter @eky/desktop e2e:prepare-electron-runtime
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_PREPARATION_FAILED' }
            pnpm --filter @eky/desktop e2e:build
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_PREPARATION_FAILED' }
          }

      - name: Run existing caller and mandatory result verifier once
        timeout-minutes: ${{ inputs.artifact_kind == 'legacy' && 27 || 25 }}
        run: |
          $legacy = $env:ARTIFACT_KIND -ceq 'legacy'
          $descriptor = if ($legacy) { 'legacy-upgrade-artifact.json' } else { 'workspace-success-artifact.json' }
          $caller = if ($legacy) { 'runLegacyUpgrade.mjs' } else { 'runWorkspaceSuccess.mjs' }
          $verifier = if ($legacy) { 'verifyLegacyCallerResult.mjs' } else { 'verifyWorkspaceCallerResult.mjs' }
          $prefix = if ($legacy) { 'eky-legacy-caller-' } else { 'eky-workspace-caller-' }
          $descriptorPath = Join-Path (Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact') $descriptor
          $resultPath = Join-Path (Join-Path $env:RUNNER_TEMP ($prefix + [Guid]::NewGuid().ToString('N'))) 'result.json'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm --filter @eky/desktop exec node "installer/windows-acceptance-harness/$caller" --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath
          $commandExit = $LASTEXITCODE
          pnpm --filter @eky/desktop exec node "installer/windows-acceptance-harness/$verifier" --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_CALLER_FAILED' }

      - name: Reverify immutable artifact after diagnostic
        if: always() && steps.download.outcome == 'success'
        run: |
          $verifier = if ($env:ARTIFACT_KIND -ceq 'legacy') { 'verifyLegacyUpgradeArtifact.mjs' } else { 'verifyWorkspaceSuccessArtifact.mjs' }
          $root = Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact'
          pnpm --filter @eky/desktop exec node "installer/windows-acceptance-harness/$verifier" --artifact-root $root --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_ARTIFACT_CHANGED' }
