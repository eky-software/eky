name: Windows acceptance supervisor feasibility

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: Contract acceptance or diagnostic comparison (not acceptance)
        type: choice
        default: contracts
        options:
          - contracts
          - encrypted-evidence-delivery-proof
          - window-startup-diagnostic
          - legacy-contracts-diagnostic
          - legacy-worker-diagnostic
          - inspection-command-contracts
          - clean-upgrade-command-diagnostic
          - product-command-diagnostic
          - inspector-analysis-diagnostic
          - inspector-external-diagnostic
          - inspector-cutoff-diagnostic
          - packaged-boundary-diagnostic
          - msi-file-version-policy
      legacy_contract_scope:
        description: Existing legacy contract diagnosis only; core does not build MSI artifacts or record traces
        type: choice
        default: all
        options: [all, core]
      artifact_kind:
        description: Existing artifact consumer (diagnostic only)
        type: choice
        options: [legacy, workspace, workspace-fault, upgrade]
      artifact_run_id:
        description: Original artifact producer run ID
        type: string
      artifact_id:
        description: Exact immutable artifact ID
        type: string
      artifact_build_revision:
        description: Original artifact build revision
        type: string
      artifact_descriptor_sha256:
        description: Expected original descriptor SHA-256
        type: string
      inspector_capture:
        description: Opt-in legacy, upgrade or workspace diagnostic; raw WPR data stays in runner temp
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-acceptance-supervisor-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ inputs.mode == 'packaged-boundary-diagnostic' && inputs.artifact_kind || inputs.mode == 'encrypted-evidence-delivery-proof' && 'encrypted-evidence-delivery-proof' || '' }}
  cancel-in-progress: true

jobs:
  encrypted-evidence-delivery-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'encrypted-evidence-delivery-proof'
    name: Synthetic encrypted delivery proof (no MSI, not acceptance)
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: eky_software
    steps:
      - name: Check out exact delivery proof revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false
      - name: Verify pinned Node and provisioned Git GnuPG
        timeout-minutes: 1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            if (!$IsWindows -or $PSVersionTable.PSVersion.Major -lt 7) { throw 'unsupported' }
            . ./apps/desktop/installer/windows-acceptance-harness/encryptedEvidenceOpenPgp.ps1
            if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or
                ![IO.Path]::IsPathFullyQualified($env:RUNNER_TEMP) -or
                ![IO.Directory]::Exists($env:RUNNER_TEMP)) { throw 'unavailable' }
            $homePath = Join-Path $env:RUNNER_TEMP ('eky-delivery-preflight-' + [Guid]::NewGuid().ToString('N'))
            if (Test-Path -LiteralPath $homePath) { throw 'unavailable' }
            [void][IO.Directory]::CreateDirectory($homePath)
            $node = (Get-Command node.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            $expected = [IO.File]::ReadAllText((Join-Path $PWD '.node-version')).Trim()
            $actual = (Invoke-EvidenceGpgProcess -Executable $node -Arguments @('--version') -HomePath $homePath -ErrorPath (Join-Path $homePath 'node.stderr.private.log') -TimeoutMilliseconds 10000 -TotalBudgetMilliseconds 10000).Trim()
            if ($actual -cne "v$expected") { throw 'unsupported' }
            $git = (Get-Command git.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            $gpg = $null
            foreach ($relative in @('../usr/bin/gpg.exe', '../../usr/bin/gpg.exe')) {
              $candidate = [IO.Path]::GetFullPath([IO.Path]::Combine([IO.Path]::GetDirectoryName($git), $relative))
              if ([IO.File]::Exists($candidate)) { $gpg = $candidate; break }
            }
            if (!$gpg) { throw 'unavailable' }
            $arguments = @('--no-options', '--homedir', (ConvertTo-EvidenceGpgPath $homePath), '--no-keyring', '--batch', '--no-tty', '--no-autostart', '--disable-dirmngr', '--version')
            $version = Invoke-EvidenceGpgProcess -Executable $gpg -Arguments $arguments -HomePath $homePath -ErrorPath (Join-Path $homePath 'gpg.stderr.private.log') -TimeoutMilliseconds 10000 -TotalBudgetMilliseconds 10000
            if ($version -cnotmatch '(?m)^gpg \(GnuPG\) 2\.(\d+)\.' -or
                [int]$Matches[1] -lt 2 -or $version -cnotmatch '\bAES256\b' -or
                $version -cnotmatch '\bRSA\b' -or $version -cnotmatch '\bECDH\b' -or
                $version -cnotmatch '\bEDDSA\b') { throw 'unsupported' }
          } catch {
            [Console]::Error.WriteLine('WORKSPACE_ENCRYPTED_EVIDENCE_TOOLS_UNVERIFIED')
            exit 1
          }
      - name: Seal one synthetic delivery proof
        id: evidence_seal
        timeout-minutes: 3
        env:
          EKY_EVIDENCE_DELIVERY_PROOF: '1'
          EKY_DIAGNOSTIC_PUBLIC_KEY: ${{ vars.EKY_DIAGNOSTIC_PUBLIC_KEY }}
          EKY_DIAGNOSTIC_KEY_FINGERPRINT: ${{ vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT }}
          EKY_DIAGNOSTIC_VERIFIED_FINGERPRINT: ${{ vars.EKY_DIAGNOSTIC_VERIFIED_FINGERPRINT }}
        run: node apps/desktop/installer/windows-acceptance-harness/workspaceEncryptedEvidence.mjs delivery-proof
      - name: Upload encrypted delivery proof only
        id: evidence_upload
        if: success() && steps.evidence_seal.outcome == 'success' && steps.evidence_seal.outputs.sealed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eky-encrypted-delivery-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence_seal.outputs.ciphertext }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
      - name: Require encrypted delivery publication
        if: always()
        shell: pwsh
        env:
          SEAL_OUTCOME: ${{ steps.evidence_seal.outcome }}
          SEALED: ${{ steps.evidence_seal.outputs.sealed }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
        run: |
          if ($env:SEAL_OUTCOME -cne 'success' -or $env:SEALED -cne 'true' -or
              $env:UPLOAD_OUTCOME -cne 'success' -or $env:ARTIFACT_ID -cnotmatch '^[1-9][0-9]*$') {
            [Console]::Error.WriteLine('WORKSPACE_ENCRYPTED_EVIDENCE_DELIVERY_UNVERIFIED')
            exit 1
          }

      - name: Produce one verified synthetic first failure
        id: failure_probe
        continue-on-error: true
        working-directory: .
        run: node .github/scripts/ciFailureEvidenceProbe.mjs

      - name: Deliver synthetic first failure through the normal collector
        id: failure_evidence
        if: ${{ always() && steps.failure_probe.outcome == 'failure' && steps.failure_probe.outputs.probe_verified == 'true' }}
        timeout-minutes: 3
        uses: ./.github/actions/collect-ci-failure-evidence
        with:
          job-key: delivery-proof-${{ strategy.job-index || 0 }}
          job-outcome: failure
          public-key: ${{ vars.EKY_DIAGNOSTIC_PUBLIC_KEY }}
          fingerprint: ${{ vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT }}
          verified-fingerprint: ${{ vars.EKY_DIAGNOSTIC_VERIFIED_FINGERPRINT }}

      - name: Require verified first failure and encrypted publication
        if: always()
        shell: pwsh
        env:
          PROBE_OUTCOME: ${{ steps.failure_probe.outcome }}
          PROBE_VERIFIED: ${{ steps.failure_probe.outputs.probe_verified }}
          DELIVERY_OUTCOME: ${{ steps.failure_evidence.outcome }}
          SEALED: ${{ steps.failure_evidence.outputs.sealed }}
          UPLOAD_OUTCOME: ${{ steps.failure_evidence.outputs.upload-outcome }}
          ARTIFACT_ID: ${{ steps.failure_evidence.outputs.artifact-id }}
        run: |
          if ($env:PROBE_OUTCOME -cne 'failure' -or $env:PROBE_VERIFIED -cne 'true' -or
              $env:DELIVERY_OUTCOME -cne 'success' -or $env:SEALED -cne 'true' -or
              $env:UPLOAD_OUTCOME -cne 'success' -or $env:ARTIFACT_ID -cnotmatch '^[1-9][0-9]*$') {
            [Console]::Error.WriteLine('CI_FIRST_FAILURE_EVIDENCE_DELIVERY_UNVERIFIED')
            exit 1
          }

  inspector-cutoff-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspector-cutoff-diagnostic'
    name: Inspector capture across command cutoff (no MSI, not acceptance)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eky_software/apps/desktop
    steps:
      - name: Check out exact cutoff diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Bind the verified SDK for the cutoff fixture
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet.exe -CommandType Application -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($dotnet) -or (& $dotnet --version) -cne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_CUTOFF_DOTNET_SDK_INVALID'
          }
          "EKY_DOTNET_EXE=$dotnet" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build existing supervisor and contract fixture
        run: node installer/windows-process-supervisor/buildWindowsAcceptanceSupervisor.mjs
      - name: Prepare synthetic cutoff fixture
        run: node installer/windows-acceptance-harness/legacyCaptureCutoffFixture.mjs prepare
      - name: Start existing bounded capture
        id: cutoff_capture_start
        timeout-minutes: 1
        shell: pwsh
        run: ./installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode start
      - name: Interrupt the held synthetic command step
        id: cutoff_command
        # The shorter step limit injects the failure; normal command budgets stay unchanged.
        timeout-minutes: 1
        continue-on-error: true
        shell: pwsh
        run: |
          $request = Join-Path $env:RUNNER_TEMP 'eky-inspector-cutoff/request.json'
          & $env:EKY_DOTNET_EXE installer/bin/windows-process-supervisor-contract-fixture/Release/net10.0/Eky.WindowsProcessSupervisor.ContractFixture.dll --mode legacyCommandEntry --request $request
          throw 'INSPECTOR_CUTOFF_COMMAND_RETURNED_WITHOUT_STEP_INTERRUPTION'
      - name: Stop existing bounded capture after cutoff
        id: cutoff_capture_stop
        if: always() && steps.cutoff_capture_start.outcome != 'skipped'
        timeout-minutes: 2
        shell: pwsh
        run: ./installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode stop
      - name: Report missing command result separately from cleanup
        if: always()
        timeout-minutes: 1
        env:
          CUTOFF_STEP_OUTCOME: ${{ steps.cutoff_command.outcome }}
        run: node installer/windows-acceptance-harness/legacyCaptureCutoffFixture.mjs report
      - name: Read existing command lifetimes after cutoff
        if: always() && steps.cutoff_capture_stop.outcome == 'success'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $output = [Collections.Generic.List[string]]::new()
          & ./installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode analyze -LegacyCommand -ContractFixture | ForEach-Object {
            $output.Add([string]$_)
            Write-Output $_
          }
          $analysisExit = $LASTEXITCODE
          $lifetimes = @($output | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.phase -ceq 'commandLifetimeAnalysis' })
          foreach ($phase in @('command', 'scenario')) {
            $observed = @($lifetimes | Where-Object { $_.commandPhase -ceq $phase })
            if ($observed.Count -ne 1 -or $observed[0].status -cne 'completed' -or
                $observed[0].cleanup -cne 'notInferred' -or $observed[0].cause -cne 'notEstablished') {
              throw 'INSPECTOR_CUTOFF_LIFETIME_UNVERIFIED'
            }
          }
          if ($analysisExit -ne 0) { throw 'INSPECTOR_CUTOFF_EXTRACTION_INCOMPLETE' }

  msi-file-version-policy:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'msi-file-version-policy'
    name: Synthetic MSI file-version policy
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eky_software/apps/desktop
    steps:
      - name: Check out exact policy revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Bind the verified SDK executable
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet.exe -CommandType Application -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($dotnet) -or (& $dotnet --version) -cne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_POLICY_DOTNET_SDK_INVALID'
          }
          "EKY_DOTNET_EXE=$dotnet" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run deterministic MSI file-policy contracts
        run: >-
          node --test
          installer/windows-acceptance-harness/fixtures/buildMsiFileVersionPolicyFixture.test.mjs
          installer/windows-acceptance-harness/fixtures/msiFileVersionPolicyLifecycle.test.mjs
          installer/windows-acceptance-harness/fixtures/msiFileVersionPolicyRuntime.test.mjs
      - name: Build existing supervisor once
        run: node installer/windows-process-supervisor/buildWindowsAcceptanceSupervisor.mjs
      - name: Verify synthetic MSI UI and file-version policy
        run: node installer/windows-acceptance-harness/fixtures/runMsiFileVersionPolicyProbe.mjs

  job-object-feasibility:
    if: inputs.mode != 'packaged-boundary-diagnostic' && inputs.mode != 'msi-file-version-policy' && inputs.mode != 'inspector-cutoff-diagnostic' && inputs.mode != 'encrypted-evidence-delivery-proof'
    name: ${{ inputs.mode == 'product-command-diagnostic' && format('Product command diagnostic run {0} (no MSI, not acceptance)', matrix.repetition) || inputs.mode == 'clean-upgrade-command-diagnostic' && format('Clean and upgrade command diagnostic run {0} (no MSI, not acceptance)', matrix.repetition) || inputs.mode == 'inspection-command-contracts' && 'Inspection failure command contracts (no MSI, not acceptance)' || inputs.mode == 'inspector-external-diagnostic' && 'External inspector capture (no MSI, not acceptance)' || inputs.mode == 'inspector-analysis-diagnostic' && 'Inspector analysis diagnostic (no MSI, not acceptance)' || inputs.mode == 'window-startup-diagnostic' && 'V2.5 window startup diagnostic (not acceptance)' || inputs.mode == 'legacy-worker-diagnostic' && format('V2.5 worker diagnostic run {0} (not acceptance)', matrix.repetition) || inputs.mode == 'legacy-contracts-diagnostic' && format('V2.5 contracts diagnostic run {0} (not acceptance)', matrix.repetition) || format('Windows Job Object feasibility run {0}', matrix.repetition) }}
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        repetition: ${{ fromJSON((inputs.mode == 'inspection-command-contracts' || inputs.mode == 'window-startup-diagnostic' || inputs.mode == 'inspector-analysis-diagnostic' || inputs.mode == 'inspector-external-diagnostic') && '[1]' || '[1, 2]') }}

    defaults:
      run:
        working-directory: eky_software/apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Bind the verified SDK executable for all process contracts
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet.exe -CommandType Application -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($dotnet) -or (& $dotnet --version) -ne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_SUPERVISOR_DOTNET_SDK_INVALID'
          }
          "EKY_DOTNET_EXE=$dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows process supervisor
        if: inputs.mode != 'legacy-contracts-diagnostic' && inputs.mode != 'clean-upgrade-command-diagnostic'
        run: node installer/windows-process-supervisor/buildWindowsAcceptanceSupervisor.mjs

      - name: Run supervisor unit and process contracts
        if: inputs.mode != 'product-command-diagnostic' && inputs.mode != 'clean-upgrade-command-diagnostic' && inputs.mode != 'inspection-command-contracts' && inputs.mode != 'window-startup-diagnostic' && inputs.mode != 'legacy-contracts-diagnostic' && inputs.mode != 'legacy-worker-diagnostic' && inputs.mode != 'inspector-analysis-diagnostic' && inputs.mode != 'inspector-external-diagnostic'
        run: >-
          node --test --test-concurrency=1
          installer/windows-process-supervisor/tests/windowsAcceptanceSupervisorResult.test.mjs
          installer/windows-process-supervisor/tests/windowsAcceptanceSupervisor.contract.test.mjs

      - name: Diagnose one native window startup without MSI or acceptance matrix
        if: inputs.mode == 'window-startup-diagnostic'
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern="^native close observation: visible$"
          installer/windows-acceptance-harness/requestWindowsApplicationClose.test.mjs

      - name: Prepare locked package manager for diagnostic contracts
        if: inputs.mode == 'legacy-contracts-diagnostic' || inputs.mode == 'inspection-command-contracts' || inputs.mode == 'clean-upgrade-command-diagnostic' || inputs.mode == 'product-command-diagnostic'
        working-directory: .
        run: node .github/scripts/prepareLockedPnpm.mjs

      - name: Prepare locked package manager before inspection command contracts
        if: inputs.mode == 'inspection-command-contracts' || inputs.mode == 'clean-upgrade-command-diagnostic' || inputs.mode == 'product-command-diagnostic' || (inputs.mode == 'legacy-contracts-diagnostic' && inputs.legacy_contract_scope == 'core')
        shell: pwsh
        run: |
          $expected = ((Get-Content ../../package.json -Raw | ConvertFrom-Json).packageManager -split '@')[1]
          $actual = pnpm --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -cne $expected) {
            throw 'WINDOWS_ACCEPTANCE_LEGACY_PACKAGE_MANAGER_UNAVAILABLE'
          }

      - name: Verify inspection failure through both existing CI command chains
        if: inputs.mode == 'inspection-command-contracts'
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern="^(legacy|workspace-fault) CI launch chain completes the real phase chain: productInspectionHold$"
          installer/windows-acceptance-harness/legacyCommandEntrypoint.process.test.mjs
          installer/windows-acceptance-harness/workspaceFaultCommandEntrypoint.process.test.mjs

      - name: Record diagnostic revision and runner image
        if: inputs.mode == 'legacy-contracts-diagnostic' || inputs.mode == 'legacy-worker-diagnostic' || inputs.mode == 'clean-upgrade-command-diagnostic'
        shell: pwsh
        env:
          DIAGNOSTIC_REPETITION: ${{ matrix.repetition }}
        run: |
          [ordered]@{
            schemaVersion = 1
            diagnosticOnly = $true
            harnessRevision = $env:GITHUB_SHA
            repetition = [int]$env:DIAGNOSTIC_REPETITION
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            nodeVersion = (node --version)
            dotnetVersion = (dotnet --version)
          } | ConvertTo-Json -Compress

      - name: Build existing supervisor for clean and upgrade diagnosis
        if: inputs.mode == 'clean-upgrade-command-diagnostic'
        run: pnpm installer:supervisor:build

      - name: Diagnose existing clean and upgrade command group without MSI
        if: inputs.mode == 'clean-upgrade-command-diagnostic'
        run: pnpm installer:test:windows-supervisor-v2-legacy-clean-upgrade-entry

      - name: Diagnose existing product command group without MSI
        if: inputs.mode == 'product-command-diagnostic'
        run: pnpm installer:test:windows-supervisor-v2-legacy-commands

      - name: Diagnose full V2.5 contract suite with unchanged default budgets
        if: inputs.mode == 'legacy-contracts-diagnostic' && inputs.legacy_contract_scope != 'core'
        run: pnpm installer:test:windows-supervisor-v2-legacy

      - name: Build existing supervisor for core diagnosis
        if: inputs.mode == 'legacy-contracts-diagnostic' && inputs.legacy_contract_scope == 'core'
        run: pnpm installer:supervisor:build

      - name: Diagnose existing legacy core group without MSI or recording
        if: inputs.mode == 'legacy-contracts-diagnostic' && inputs.legacy_contract_scope == 'core'
        run: pnpm installer:test:windows-supervisor-v2-legacy-core

      - name: Diagnose legacy worker live-child contract without MSI or acceptance matrix
        if: inputs.mode == 'legacy-worker-diagnostic'
        run: >-
          node --test --test-concurrency=1
          installer/windows-acceptance-harness/runLegacyUpgradeWorker.test.mjs

      - name: Start bounded inspector analysis fixture capture
        id: inspector_analysis_start
        if: inputs.mode == 'inspector-analysis-diagnostic' || inputs.mode == 'inspector-external-diagnostic'
        timeout-minutes: 1
        shell: pwsh
        run: ./installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode start

      - name: Exercise existing native hold command without MSI
        if: inputs.mode == 'inspector-analysis-diagnostic'
        timeout-minutes: 2
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern="^legacy fixed command entrypoint completes the real phase chain: productInspectionNativeHold$"
          installer/windows-acceptance-harness/legacyCommandEntrypoint.process.test.mjs

      - name: Exercise one real read-only inspector without an internal listener
        if: inputs.mode == 'inspector-external-diagnostic'
        timeout-minutes: 2
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern="^legacy fixed command entrypoint completes the real phase chain: productInspectionReadOnly$"
          installer/windows-acceptance-harness/legacyCommandEntrypoint.process.test.mjs

      - name: Stop bounded inspector analysis fixture capture
        id: inspector_analysis_stop
        if: always() && (inputs.mode == 'inspector-analysis-diagnostic' || inputs.mode == 'inspector-external-diagnostic') && steps.inspector_analysis_start.outcome != 'skipped'
        timeout-minutes: 2
        shell: pwsh
        run: ./installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode stop

      - name: Verify exporter reader and intentional wait without MSI
        if: always() && inputs.mode == 'inspector-analysis-diagnostic' && steps.inspector_analysis_stop.outcome == 'success'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $output = & ./installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode analyze -LegacyCommand -ContractFixture
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) { throw 'INSPECTOR_ANALYSIS_DIAGNOSTIC_FAILED' }
          $summaries = @($output | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.phase -ceq 'analysis' })
          if ($summaries.Count -ne 1 -or $summaries[0].firstBoundary -cne 'scriptStarted' -or
              $summaries[0].lastBoundary -cne 'productStateStarted' -or
              $summaries[0].schedulingObservation -cne 'switchIntervalAfterLastEvent' -or
              $summaries[0].scriptFinishedObserved -ne $false) {
            throw 'INSPECTOR_SYNTHETIC_WAIT_UNVERIFIED'
          }

      - name: Compare two event views on the same stopped trace
        if: always() && inputs.mode == 'inspector-external-diagnostic' && steps.inspector_analysis_stop.outcome == 'success'
        timeout-minutes: 3
        shell: pwsh
        run: ./installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode compareEvents

      - name: Preserve encrypted CI failure evidence
        if: >-
          ${{ always() && runner.os == 'Windows' && runner.environment == 'github-hosted'
            && (job.status == 'failure' || job.status == 'cancelled')
            && vars.EKY_DIAGNOSTIC_PUBLIC_KEY != '' && vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT != ''
            && vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT == vars.EKY_DIAGNOSTIC_VERIFIED_FINGERPRINT
            && (github.event_name == 'push' || github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch'
              || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
            && (inputs.mode == '' || inputs.mode == 'contracts')
            && hashFiles('.github/actions/collect-ci-failure-evidence/action.yml') != ''
            && hashFiles('eky_software/apps/desktop/installer/windows-acceptance-harness/ciFailureEvidence.mjs') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/collect-ci-failure-evidence
        with:
          job-key: supervisor-contracts-${{ strategy.job-index || 0 }}
          job-outcome: ${{ job.status }}
          public-key: ${{ vars.EKY_DIAGNOSTIC_PUBLIC_KEY }}
          fingerprint: ${{ vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT }}
          verified-fingerprint: ${{ vars.EKY_DIAGNOSTIC_VERIFIED_FINGERPRINT }}

  packaged-boundary-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'packaged-boundary-diagnostic'
    name: Existing ${{ inputs.artifact_kind }} artifact caller diagnostic (not acceptance)
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.inspector_capture && inputs.artifact_kind == 'workspace-fault' && 96 || inputs.inspector_capture && inputs.artifact_kind == 'workspace' && 38 || (inputs.artifact_kind == 'legacy' || inputs.artifact_kind == 'upgrade') && 37 || 30 }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: eky_software
        shell: pwsh
    env:
      ARTIFACT_KIND: ${{ inputs.artifact_kind }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      EXPECTED_BUILD_REVISION: ${{ inputs.artifact_build_revision }}
      EXPECTED_DESCRIPTOR_SHA256: ${{ inputs.artifact_descriptor_sha256 }}
      INSPECTOR_CAPTURE: ${{ inputs.inspector_capture }}
    steps:
      - name: Check out exact diagnostic harness revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate closed diagnostic identity before download
        run: |
          if ($env:INSPECTOR_CAPTURE -ceq 'true' -and $env:ARTIFACT_KIND -cnotin @('legacy', 'upgrade', 'workspace', 'workspace-fault')) {
            throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_CAPTURE_SCOPE_INVALID'
          }
          if ($env:ARTIFACT_KIND -cnotin @('legacy', 'workspace', 'workspace-fault', 'upgrade') -or
              $env:ARTIFACT_RUN_ID -cnotmatch '^[1-9][0-9]{0,19}$' -or
              $env:ARTIFACT_ID -cnotmatch '^[1-9][0-9]{0,19}$' -or
              $env:EXPECTED_BUILD_REVISION -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_DESCRIPTOR_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_IDENTITY_INVALID'
          }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_CHECKOUT_INVALID'
          }
          [ordered]@{ schemaVersion = 1; diagnosticOnly = $true;
            harnessRevision = $head; artifactBuildRevision = $env:EXPECTED_BUILD_REVISION;
            artifactRunId = $env:ARTIFACT_RUN_ID; artifactId = $env:ARTIFACT_ID;
            descriptorSha256 = $env:EXPECTED_DESCRIPTOR_SHA256 } | ConvertTo-Json -Compress

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up existing .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302

      - name: Prepare locked package manager
        working-directory: .
        run: node .github/scripts/prepareLockedPnpm.mjs

      - name: Bind verified SDK and install existing locked dependencies
        run: |
          $dotnet = (Get-Command dotnet.exe -CommandType Application -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathFullyQualified($dotnet) -or (& $dotnet --version) -cne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_SDK_INVALID'
          }
          "EKY_DOTNET_EXE=$dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_PREPARATION_FAILED' }

      - name: Download only the specified existing artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: ${{ runner.temp }}/eky-existing-boundary-artifact

      - name: Verify existing artifact before diagnostic
        run: |
          $verifier = switch -CaseSensitive ($env:ARTIFACT_KIND) {
            'legacy' { 'verifyLegacyUpgradeArtifact.mjs' }
            'workspace' { 'verifyWorkspaceSuccessArtifact.mjs' }
            'workspace-fault' { 'verifyWorkspaceSuccessArtifact.mjs' }
            'upgrade' { 'verifyUpgradeRollbackArtifact.mjs' }
          }
          $root = Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact'
          node "apps/desktop/installer/windows-acceptance-harness/$verifier" --artifact-root $root --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_ARTIFACT_INVALID' }

      - name: Prepare existing supervisor and only the required proof readers
        timeout-minutes: 3
        run: |
          pnpm --filter @eky/desktop installer:supervisor:build
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_PREPARATION_FAILED' }
          if ($env:ARTIFACT_KIND -cin @('workspace', 'workspace-fault')) {
            pnpm --filter @eky/desktop e2e:prepare-electron-runtime
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_PREPARATION_FAILED' }
            pnpm --filter @eky/desktop e2e:build
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_PREPARATION_FAILED' }
          }

      - name: Preserve workspace pre-update failure prefix
        if: inputs.inspector_capture && inputs.artifact_kind == 'workspace-fault'
        timeout-minutes: 25
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact/workspace-success-artifact.json'
          $resultPath = Join-Path $env:RUNNER_TEMP ('eky-workspace-caller-' + [Guid]::NewGuid().ToString('N') + '/result.json')
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet apps/desktop/installer/bin/windows-process-supervisor/Release/net10.0/Eky.WindowsProcessSupervisor.dll --workspace-fault-command --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario preUpdateRecoveryPointFailure --result-path $resultPath
          $commandExit = $LASTEXITCODE
          node apps/desktop/installer/windows-acceptance-harness/verifyWorkspaceCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario preUpdateRecoveryPointFailure --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_CALLER_FAILED' }

      - name: Preserve workspace active rollback prefix
        if: inputs.inspector_capture && inputs.artifact_kind == 'workspace-fault'
        timeout-minutes: 25
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact/workspace-success-artifact.json'
          $resultPath = Join-Path $env:RUNNER_TEMP ('eky-workspace-caller-' + [Guid]::NewGuid().ToString('N') + '/result.json')
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet apps/desktop/installer/bin/windows-process-supervisor/Release/net10.0/Eky.WindowsProcessSupervisor.dll --workspace-fault-command --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario activeWorkspaceFirstStartFailure --result-path $resultPath
          $commandExit = $LASTEXITCODE
          node apps/desktop/installer/windows-acceptance-harness/verifyWorkspaceCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario activeWorkspaceFirstStartFailure --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_CALLER_FAILED' }

      - name: Start opt-in external inspector capture
        id: capture
        if: inputs.inspector_capture && (inputs.artifact_kind == 'legacy' || inputs.artifact_kind == 'upgrade' || inputs.artifact_kind == 'workspace' || inputs.artifact_kind == 'workspace-fault')
        continue-on-error: ${{ inputs.artifact_kind == 'workspace-fault' }}
        timeout-minutes: 1
        run: ./apps/desktop/installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode start

      - name: Run existing caller and mandatory result verifier once
        timeout-minutes: ${{ (inputs.artifact_kind == 'legacy' || inputs.artifact_kind == 'upgrade') && 27 || 25 }}
        env:
          EKY_ACCEPTANCE_LEGACY_PAYLOAD_OBSERVATION: ${{ inputs.artifact_kind == 'legacy' && '1' || '0' }}
        run: |
          if ($env:ARTIFACT_KIND -ceq 'upgrade') {
            $descriptorPath = Join-Path (Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact') 'upgrade-rollback-artifact.json'
            $resultPath = Join-Path $env:RUNNER_TEMP ('eky-upgrade-caller-' + [guid]::NewGuid().ToString('N') + '\result.json')
            $PSNativeCommandUseErrorActionPreference = $false
            dotnet apps/desktop/installer/bin/windows-process-supervisor/Release/net10.0/Eky.WindowsProcessSupervisor.dll --upgrade-command --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath
            $commandExit = $LASTEXITCODE
            node apps/desktop/installer/windows-acceptance-harness/verifyUpgradeCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath --command-exit $commandExit
            if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_CALLER_FAILED' }
            exit 0
          }
          if ($env:ARTIFACT_KIND -ceq 'workspace-fault') {
            $descriptorPath = Join-Path (Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact') 'workspace-success-artifact.json'
            $PSNativeCommandUseErrorActionPreference = $false
            $scenarios = if ($env:INSPECTOR_CAPTURE -ceq 'true') { @('acceptanceInterruption') }
              else { @('preUpdateRecoveryPointFailure', 'activeWorkspaceFirstStartFailure') }
            foreach ($faultScenario in $scenarios) {
              $resultPath = Join-Path (Join-Path $env:RUNNER_TEMP ('eky-workspace-caller-' + [Guid]::NewGuid().ToString('N'))) 'result.json'
              dotnet apps/desktop/installer/bin/windows-process-supervisor/Release/net10.0/Eky.WindowsProcessSupervisor.dll --workspace-fault-command --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario $faultScenario --result-path $resultPath
              $commandExit = $LASTEXITCODE
              node apps/desktop/installer/windows-acceptance-harness/verifyWorkspaceCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --fault-scenario $faultScenario --result-path $resultPath --command-exit $commandExit
              if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_CALLER_FAILED' }
            }
            exit 0
          }
          $legacy = $env:ARTIFACT_KIND -ceq 'legacy'
          $descriptor = if ($legacy) { 'legacy-upgrade-artifact.json' } else { 'workspace-success-artifact.json' }
          $verifier = if ($legacy) { 'verifyLegacyCallerResult.mjs' } else { 'verifyWorkspaceCallerResult.mjs' }
          $prefix = if ($legacy) { 'eky-legacy-caller-' } else { 'eky-workspace-caller-' }
          $descriptorPath = Join-Path (Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact') $descriptor
          $resultPath = Join-Path (Join-Path $env:RUNNER_TEMP ($prefix + [Guid]::NewGuid().ToString('N'))) 'result.json'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($legacy) {
            dotnet apps/desktop/installer/bin/windows-process-supervisor/Release/net10.0/Eky.WindowsProcessSupervisor.dll --legacy-command --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath
          } else {
            try { Write-Host '{"schemaVersion":1,"operation":"workspaceCallerDiagnostic","phase":"commandInvoked"}' } catch { }
            dotnet apps/desktop/installer/bin/windows-process-supervisor/Release/net10.0/Eky.WindowsProcessSupervisor.dll --workspace-success-command --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath
          }
          $commandExit = $LASTEXITCODE
          if (-not $legacy) {
            try { Write-Host '{"schemaVersion":1,"operation":"workspaceCallerDiagnostic","phase":"commandReturned"}' } catch { }
            try { Write-Host '{"schemaVersion":1,"operation":"workspaceCallerDiagnostic","phase":"verifierInvoked"}' } catch { }
          }
          node "apps/desktop/installer/windows-acceptance-harness/$verifier" --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath --command-exit $commandExit
          $verifierExit = $LASTEXITCODE
          if (-not $legacy) {
            try { Write-Host '{"schemaVersion":1,"operation":"workspaceCallerDiagnostic","phase":"verifierReturned"}' } catch { }
          }
          if ($commandExit -ne 0 -or $verifierExit -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_CALLER_FAILED' }

      - name: Stop only the diagnostic recording
        id: capture_stop
        if: always() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure' || steps.capture.outcome == 'cancelled')
        timeout-minutes: 2
        continue-on-error: ${{ inputs.artifact_kind == 'workspace-fault' }}
        run: ./apps/desktop/installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode stop

      - name: Reverify immutable artifact after diagnostic
        if: always() && steps.download.outcome == 'success'
        timeout-minutes: ${{ inputs.inspector_capture && inputs.artifact_kind == 'workspace' && 2 || 360 }}
        run: |
          $verifier = switch -CaseSensitive ($env:ARTIFACT_KIND) {
            'legacy' { 'verifyLegacyUpgradeArtifact.mjs' }
            'workspace' { 'verifyWorkspaceSuccessArtifact.mjs' }
            'workspace-fault' { 'verifyWorkspaceSuccessArtifact.mjs' }
            'upgrade' { 'verifyUpgradeRollbackArtifact.mjs' }
          }
          $root = Join-Path $env:RUNNER_TEMP 'eky-existing-boundary-artifact'
          node "apps/desktop/installer/windows-acceptance-harness/$verifier" --artifact-root $root --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_DIAGNOSTIC_ARTIFACT_CHANGED' }

      - name: Extract closed inspector observations without publishing raw trace
        if: always() && steps.capture_stop.outcome == 'success'
        timeout-minutes: 3
        continue-on-error: ${{ inputs.artifact_kind == 'workspace-fault' }}
        run: |
          if ($env:ARTIFACT_KIND -ceq 'legacy') {
            ./apps/desktop/installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode analyze -LegacyCommand
          } elseif ($env:ARTIFACT_KIND -ceq 'workspace-fault') {
            ./apps/desktop/installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode analyze -WorkspaceFaultCommand
          } elseif ($env:ARTIFACT_KIND -ceq 'workspace') {
            ./apps/desktop/installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode analyze -WorkspaceSuccessCommand
          } else {
            ./apps/desktop/installer/windows-acceptance-harness/captureInstallerProductInspection.ps1 -Mode analyze
          }
