name: Windows acceptance supervisor feasibility

on:
  pull_request:
    paths:
      - .github/workflows/windows-acceptance-supervisor-feasibility.yml
      - eky_software/apps/desktop/installer/windows-process-supervisor/**
      - eky_software/apps/desktop/package.json
      - eky_software/docs/architecture/windows-installer-acceptance-harness-v2.md
  workflow_dispatch:
    inputs:
      mode:
        description: Contract acceptance or diagnostic comparison (not acceptance)
        type: choice
        default: contracts
        options:
          - contracts
          - window-startup-diagnostic
          - legacy-contracts-diagnostic

permissions:
  contents: read

concurrency:
  group: windows-acceptance-supervisor-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  job-object-feasibility:
    name: ${{ inputs.mode == 'window-startup-diagnostic' && 'V2.5 window startup diagnostic (not acceptance)' || inputs.mode == 'legacy-contracts-diagnostic' && format('V2.5 contracts diagnostic run {0} (not acceptance)', matrix.repetition) || format('Windows Job Object feasibility run {0}', matrix.repetition) }}
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        repetition: ${{ fromJSON(inputs.mode == 'window-startup-diagnostic' && '[1]' || '[1, 2]') }}

    defaults:
      run:
        working-directory: eky_software/apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          if ((dotnet --version) -ne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_SUPERVISOR_DOTNET_SDK_INVALID'
          }

      - name: Build Windows process supervisor
        if: inputs.mode != 'legacy-contracts-diagnostic'
        run: node installer/windows-process-supervisor/buildWindowsAcceptanceSupervisor.mjs

      - name: Run supervisor unit and process contracts
        if: inputs.mode != 'window-startup-diagnostic' && inputs.mode != 'legacy-contracts-diagnostic'
        run: >-
          node --test --test-concurrency=1
          installer/windows-process-supervisor/tests/windowsAcceptanceSupervisorResult.test.mjs
          installer/windows-process-supervisor/tests/windowsAcceptanceSupervisor.contract.test.mjs

      - name: Diagnose one native window startup without MSI or acceptance matrix
        if: inputs.mode == 'window-startup-diagnostic'
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern="^native close observation: visible$"
          installer/windows-acceptance-harness/requestWindowsApplicationClose.test.mjs

      - name: Enable existing package manager for diagnostic contracts
        if: inputs.mode == 'legacy-contracts-diagnostic'
        run: corepack enable

      - name: Record diagnostic revision and runner image
        if: inputs.mode == 'legacy-contracts-diagnostic'
        shell: pwsh
        env:
          DIAGNOSTIC_REPETITION: ${{ matrix.repetition }}
        run: |
          [ordered]@{
            schemaVersion = 1
            diagnosticOnly = $true
            harnessRevision = $env:GITHUB_SHA
            repetition = [int]$env:DIAGNOSTIC_REPETITION
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            nodeVersion = (node --version)
            dotnetVersion = (dotnet --version)
          } | ConvertTo-Json -Compress

      - name: Diagnose full V2.5 contract suite with unchanged default budgets
        if: inputs.mode == 'legacy-contracts-diagnostic'
        run: pnpm installer:test:windows-supervisor-v2-legacy
