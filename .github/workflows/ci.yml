name: CI

on:
  workflow_call:
    inputs:
      risk_plan:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build backend
        run: pnpm --filter @eky/backend build

      - name: Build web
        run: pnpm --filter @eky/web build

      - name: Build desktop
        run: pnpm --filter @eky/desktop build

  e2e-system-security:
    name: System security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated system security E2E tests
        run: pnpm test:e2e:system

  e2e-web-critical:
    name: Web critical E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @eky/e2e exec playwright install --with-deps chromium

      - name: Run critical web E2E journeys
        run: pnpm --filter @eky/e2e e2e:web:critical

  e2e-electron-windows-critical:
    name: Windows Electron critical E2E
    if: fromJSON(inputs.risk_plan).gates.electronCritical
    runs-on: windows-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Electron development runtime
        run: pnpm --filter @eky/desktop e2e:prepare-electron-runtime

      - name: Package Windows desktop
        run: pnpm --filter @eky/desktop package:windows

      - name: Run packaged Windows smoke
        run: pnpm --filter @eky/desktop smoke:windows

      - name: Run critical Electron E2E journeys
        run: pnpm test:e2e:electron:critical

      - name: Preserve safe Electron lifecycle evidence from every failed attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: electron-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: eky_software/apps/e2e/test-results/*/electron-lifecycle.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: false
          include-hidden-files: false

  windows-contracts:
    name: Windows installer contract tests
    if: fromJSON(inputs.risk_plan).gates.windowsContracts
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eky_software
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run deterministic installer tests
        run: pnpm --filter @eky/desktop installer:test:unit
      - name: Run Windows process-contract tests serially
        run: pnpm --filter @eky/desktop installer:test:windows-process
