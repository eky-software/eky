name: CI

on:
  workflow_dispatch:
    inputs:
      electron_diagnostic:
        description: Run only the existing Electron job; not a V2 acceptance cycle
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      risk_plan:
        required: true
        type: string
      linux_ownership_prerequisites:
        required: false
        type: boolean
        default: false
      linux_pid_namespace_experiment:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    if: inputs.risk_plan != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build backend
        run: pnpm --filter @eky/backend build

      - name: Build web
        run: pnpm --filter @eky/web build

      - name: Build desktop
        run: pnpm --filter @eky/desktop build

  e2e-system-security:
    name: System security E2E
    if: inputs.risk_plan != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated system security E2E tests
        env:
          EKY_E2E: '1'
          EKY_LINUX_OWNERSHIP_PREREQUISITES: ${{ inputs.linux_ownership_prerequisites == true }}
        run: |
          if [ "$EKY_LINUX_OWNERSHIP_PREREQUISITES" = "true" ]; then
            checkout_sha="$(git rev-parse --verify HEAD 2>/dev/null)" || checkout_sha=""
            if node apps/e2e/experiments/processOwnership/probeLinuxPrerequisites.mjs --consumer=system-api --checkout-sha="$checkout_sha" 2>/dev/null; then
              printf '%s\n' 'LINUX_PREREQUISITE_EXIT_OK'
            else
              printf '%s\n' 'LINUX_PREREQUISITE_EXIT_UNVERIFIED'
            fi
          fi
          pnpm test:e2e:system

      - name: Observe bounded system PID namespace experiment
        if: success() && inputs.linux_pid_namespace_experiment == true
        env:
          EKY_E2E: '1'
        run: |
          checkout_sha="$(git rev-parse --verify HEAD 2>/dev/null)" || checkout_sha=""
          node apps/e2e/experiments/processOwnership/runPidNamespaceExperiment.mjs --consumer=system-api --checkout-sha="$checkout_sha" 2>/dev/null

  e2e-web-critical:
    name: Web critical E2E
    if: inputs.risk_plan != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @eky/e2e exec playwright install --with-deps chromium

      - name: Run critical web E2E journeys
        env:
          EKY_E2E: '1'
          EKY_LINUX_OWNERSHIP_PREREQUISITES: ${{ inputs.linux_ownership_prerequisites == true }}
        run: |
          if [ "$EKY_LINUX_OWNERSHIP_PREREQUISITES" = "true" ]; then
            checkout_sha="$(git rev-parse --verify HEAD 2>/dev/null)" || checkout_sha=""
            if node apps/e2e/experiments/processOwnership/probeLinuxPrerequisites.mjs --consumer=web-chromium --checkout-sha="$checkout_sha" 2>/dev/null; then
              printf '%s\n' 'LINUX_PREREQUISITE_EXIT_OK'
            else
              printf '%s\n' 'LINUX_PREREQUISITE_EXIT_UNVERIFIED'
            fi
          fi
          pnpm --filter @eky/e2e e2e:web:critical

      - name: Observe bounded web PID namespace experiment
        if: success() && inputs.linux_pid_namespace_experiment == true
        env:
          EKY_E2E: '1'
        run: |
          checkout_sha="$(git rev-parse --verify HEAD 2>/dev/null)" || checkout_sha=""
          node apps/e2e/experiments/processOwnership/runPidNamespaceExperiment.mjs --consumer=web-chromium --checkout-sha="$checkout_sha" 2>/dev/null

  e2e-electron-windows-critical:
    name: Windows Electron critical E2E
    if: (inputs.risk_plan == '' && inputs.electron_diagnostic) || (inputs.risk_plan != '' && fromJSON(inputs.risk_plan).gates.electronCritical)
    runs-on: windows-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Electron development runtime
        run: pnpm --filter @eky/desktop e2e:prepare-electron-runtime

      - name: Package Windows desktop
        run: pnpm --filter @eky/desktop package:windows

      - name: Run packaged Windows smoke
        run: pnpm --filter @eky/desktop smoke:windows

      - name: Run critical Electron E2E journeys
        run: pnpm test:e2e:electron:critical

      - name: Verify Electron startup observation wiring
        if: inputs.risk_plan == '' && inputs.electron_diagnostic
        run: pnpm --filter @eky/e2e exec playwright test --project=electron-development --grep @diagnostic-contract --workers=1 --retries=0

      - name: Preserve safe Electron lifecycle evidence from every failed attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: electron-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: eky_software/apps/e2e/test-results/*/electron-lifecycle.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: false
          include-hidden-files: false

  windows-contracts:
    name: Windows installer contract tests
    if: inputs.risk_plan != '' && fromJSON(inputs.risk_plan).gates.windowsContracts
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eky_software
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run deterministic installer tests
        run: pnpm --filter @eky/desktop installer:test:unit
      - name: Run Windows process-contract tests serially
        run: pnpm --filter @eky/desktop installer:test:windows-process
