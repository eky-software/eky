name: Windows acceptance V2 upgrade artifact

on:
  workflow_call:
    inputs:
      risk_plan:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-acceptance-v2-upgrade-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EKY_V2_UPGRADE_ARTIFACT_NAME: eky-v2-upgrade-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  upgrade_artifact_producer:
    name: Build upgrade acceptance artifact once
    runs-on: windows-latest
    timeout-minutes: 30

    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      build_revision: ${{ steps.produce.outputs.build_revision }}
      descriptor_sha256: ${{ steps.produce.outputs.descriptor_sha256 }}
      source_package_sha256: ${{ steps.produce.outputs.source_package_sha256 }}
      target_package_sha256: ${{ steps.produce.outputs.target_package_sha256 }}
      windows_rollback_package_sha256: ${{ steps.produce.outputs.windows_rollback_package_sha256 }}

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          if ((dotnet --version) -ne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_DOTNET_SDK_INVALID'
          }

      - name: Prepare locked package manager
        working-directory: .
        run: node .github/scripts/prepareLockedPnpm.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify V2.4 artifact contracts
        run: pnpm --filter @eky/desktop installer:test:windows-acceptance-upgrade-artifact

      - name: Restore locked WiX toolchain
        run: pnpm --filter @eky/desktop installer:verify-restore-lock

      - name: Build upgrade artifact once
        id: produce
        shell: pwsh
        timeout-minutes: 22
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-upgrade-artifact'
          $summaryPath = Join-Path $env:RUNNER_TEMP 'eky-v2-upgrade-summary.json'
          if ((Test-Path -LiteralPath $artifactRoot) -or (Test-Path -LiteralPath $summaryPath)) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_OUTPUT_EXISTS'
          }

          pnpm --filter @eky/desktop installer:v2-upgrade-artifact:build --artifact-root $artifactRoot --summary-path $summaryPath
          if ($LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_BUILD_FAILED'
          }

          $summary = Get-Content -LiteralPath $summaryPath -Raw -Encoding utf8 | ConvertFrom-Json
          $expectedKeys = @(
            'buildRevision',
            'descriptorSha256',
            'resultCode',
            'schemaVersion',
            'sourcePackageSha256',
            'status',
            'targetPackageSha256',
            'windowsRollbackPackageSha256'
          ) | Sort-Object
          $actualKeys = @($summary.PSObject.Properties.Name | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expectedKeys -DifferenceObject $actualKeys).Count -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_SUMMARY_INVALID'
          }
          if (
            $summary.schemaVersion -ne 1 -or
            $summary.status -cne 'completed' -or
            $summary.resultCode -cne 'upgradeRollbackArtifactBuilt' -or
            $summary.buildRevision -notmatch '^[0-9a-f]{40}$' -or
            $summary.descriptorSha256 -notmatch '^[0-9a-f]{64}$' -or
            $summary.sourcePackageSha256 -notmatch '^[0-9a-f]{64}$' -or
            $summary.targetPackageSha256 -notmatch '^[0-9a-f]{64}$' -or
            $summary.windowsRollbackPackageSha256 -notmatch '^[0-9a-f]{64}$'
          ) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_SUMMARY_INVALID'
          }
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $summary.buildRevision -cne $headRevision) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_BUILD_IDENTITY_MISMATCH'
          }

          "build_revision=$($summary.buildRevision)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "descriptor_sha256=$($summary.descriptorSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_package_sha256=$($summary.sourcePackageSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_package_sha256=$($summary.targetPackageSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "windows_rollback_package_sha256=$($summary.windowsRollbackPackageSha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Remove producer staging after native loader process exit
        if: ${{ always() && steps.produce.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $stageRoot = Join-Path $PWD 'apps\desktop\.stage\windows-acceptance-v2-upgrade'
          Remove-Item -LiteralPath $stageRoot -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $stageRoot) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_STAGE_CLEANUP_FAILED'
          }

      - name: Verify produced artifact bytes
        shell: pwsh
        env:
          EXPECTED_BUILD_REVISION: ${{ steps.produce.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ steps.produce.outputs.descriptor_sha256 }}
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-upgrade-artifact'
          pnpm --filter @eky/desktop installer:v2-upgrade-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_VERIFICATION_FAILED'
          }

      - name: Upload exact upgrade artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.EKY_V2_UPGRADE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/eky-v2-upgrade-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Preserve encrypted CI failure evidence
        if: >-
          ${{ always() && runner.os == 'Windows' && runner.environment == 'github-hosted'
            && (job.status == 'failure' || job.status == 'cancelled')
            && vars.EKY_DIAGNOSTIC_PUBLIC_KEY != '' && vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT != ''
            && vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT == vars.EKY_DIAGNOSTIC_VERIFIED_FINGERPRINT
            && (github.event_name == 'push' || github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch'
              || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
            && hashFiles('.github/actions/collect-ci-failure-evidence/action.yml') != ''
            && hashFiles('eky_software/apps/desktop/installer/windows-acceptance-harness/ciFailureEvidence.mjs') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/collect-ci-failure-evidence
        with:
          job-key: upgrade-producer-${{ strategy.job-index || 0 }}
          job-outcome: ${{ job.status }}
          public-key: ${{ vars.EKY_DIAGNOSTIC_PUBLIC_KEY }}
          fingerprint: ${{ vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT }}
          verified-fingerprint: ${{ vars.EKY_DIAGNOSTIC_VERIFIED_FINGERPRINT }}

  upgrade_consumer:
    name: Verify upgrade and rollback run ${{ matrix.repetition }}
    needs: upgrade_artifact_producer
    runs-on: windows-latest
    timeout-minutes: 37

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repetition: ${{ fromJSON(inputs.risk_plan != '' && fromJSON(inputs.risk_plan).repetitions == 1 && '[1]' || '[1, 2]') }}

    defaults:
      run:
        working-directory: eky_software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: eky_software/.node-version
          package-manager-cache: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          if ((dotnet --version) -ne '10.0.302') {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_DOTNET_SDK_INVALID'
          }

      - name: Prepare locked package manager
        working-directory: .
        run: node .github/scripts/prepareLockedPnpm.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact upgrade artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.upgrade_artifact_producer.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/eky-v2-upgrade-artifact

      - name: Verify downloaded artifact bytes
        shell: pwsh
        env:
          EXPECTED_BUILD_REVISION: ${{ needs.upgrade_artifact_producer.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.upgrade_artifact_producer.outputs.descriptor_sha256 }}
        run: |
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headRevision -cne $env:EXPECTED_BUILD_REVISION) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_BUILD_IDENTITY_MISMATCH'
          }
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-upgrade-artifact'
          pnpm --filter @eky/desktop installer:v2-upgrade-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_VERIFICATION_FAILED'
          }

      - name: Build acceptance supervisor
        shell: pwsh
        timeout-minutes: 3
        run: |
          pnpm --filter @eky/desktop installer:supervisor:build
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ACCEPTANCE_SUPERVISOR_BUILD_FAILED' }

      - name: Run supervised upgrade and rollback once
        shell: pwsh
        timeout-minutes: 27
        env:
          EXPECTED_BUILD_REVISION: ${{ needs.upgrade_artifact_producer.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.upgrade_artifact_producer.outputs.descriptor_sha256 }}
        run: |
          $descriptorPath = Join-Path $env:RUNNER_TEMP 'eky-v2-upgrade-artifact\upgrade-rollback-artifact.json'
          $resultPath = Join-Path $env:RUNNER_TEMP ('eky-upgrade-caller-' + [guid]::NewGuid().ToString('N') + '\result.json')
          dotnet apps/desktop/installer/bin/windows-process-supervisor/Release/net10.0/Eky.WindowsProcessSupervisor.dll --upgrade-command --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath
          $commandExit = $LASTEXITCODE
          node apps/desktop/installer/windows-acceptance-harness/verifyUpgradeCallerResult.mjs --artifact-descriptor $descriptorPath --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION --result-path $resultPath --command-exit $commandExit
          if ($commandExit -ne 0 -or $LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_LIFECYCLE_FAILED'
          }

      - name: Reverify downloaded artifact bytes
        if: ${{ always() && steps.download.outcome == 'success' }}
        shell: pwsh
        env:
          EXPECTED_BUILD_REVISION: ${{ needs.upgrade_artifact_producer.outputs.build_revision }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.upgrade_artifact_producer.outputs.descriptor_sha256 }}
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'eky-v2-upgrade-artifact'
          pnpm --filter @eky/desktop installer:v2-upgrade-artifact:verify --artifact-root $artifactRoot --expected-descriptor-sha256 $env:EXPECTED_DESCRIPTOR_SHA256 --expected-build-revision $env:EXPECTED_BUILD_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw 'WINDOWS_ACCEPTANCE_UPGRADE_ARTIFACT_POST_VERIFICATION_FAILED'
          }

      - name: Preserve encrypted CI failure evidence
        if: >-
          ${{ always() && runner.os == 'Windows' && runner.environment == 'github-hosted'
            && (job.status == 'failure' || job.status == 'cancelled')
            && vars.EKY_DIAGNOSTIC_PUBLIC_KEY != '' && vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT != ''
            && vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT == vars.EKY_DIAGNOSTIC_VERIFIED_FINGERPRINT
            && (github.event_name == 'push' || github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch'
              || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
            && hashFiles('.github/actions/collect-ci-failure-evidence/action.yml') != ''
            && hashFiles('eky_software/apps/desktop/installer/windows-acceptance-harness/ciFailureEvidence.mjs') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/collect-ci-failure-evidence
        with:
          job-key: upgrade-consumer-${{ strategy.job-index || 0 }}
          job-outcome: ${{ job.status }}
          public-key: ${{ vars.EKY_DIAGNOSTIC_PUBLIC_KEY }}
          fingerprint: ${{ vars.EKY_DIAGNOSTIC_KEY_FINGERPRINT }}
          verified-fingerprint: ${{ vars.EKY_DIAGNOSTIC_VERIFIED_FINGERPRINT }}
